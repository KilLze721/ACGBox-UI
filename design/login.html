<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f3f1f7" />
    <meta name="description" content="ACGBox 管理端登录入口。" />
    <title>登录 · ACGBox</title>
    <style>
      .login-page {
        --font-display: 'Noto Serif SC', 'Source Han Serif SC', 'STSong', serif;
        --font-body: 'IBM Plex Sans', 'PingFang SC', 'Microsoft YaHei', sans-serif;
        --canvas: #f3f1f7;
        --surface: rgba(255, 255, 255, 0.88);
        --surface-solid: #ffffff;
        --surface-muted: #f8f7fb;
        --ink: #25243a;
        --ink-soft: #6f6d84;
        --ink-faint: #9693a8;
        --line: rgba(61, 56, 88, 0.12);
        --line-strong: rgba(61, 56, 88, 0.2);
        --accent: #d95f86;
        --accent-strong: #bd3f69;
        --accent-soft: #f9dce6;
        --violet: #7567aa;
        --violet-soft: #e9e4f7;
        --cyan: #2da9a2;
        --cyan-soft: #dff5f2;
        --danger: #c84c5c;
        --danger-soft: #fde4e7;
        --shadow: 0 24px 72px rgba(37, 31, 67, 0.13);
        --focus: 0 0 0 3px rgba(217, 95, 134, 0.22);
        min-height: 100vh;
        margin: 0;
        color: var(--ink);
        background:
          radial-gradient(ellipse at 4% 90%, rgba(45, 169, 162, 0.09), transparent 31rem),
          radial-gradient(ellipse at 89% 11%, rgba(217, 95, 134, 0.14), transparent 29rem),
          var(--canvas);
        font-family: var(--font-body);
        font-size: 14px;
        line-height: 1.55;
        -webkit-font-smoothing: antialiased;
      }
      .login-page *, .login-page *::before, .login-page *::after { box-sizing: border-box; }
      .login-page button, .login-page input { color: inherit; font: inherit; }
      .login-page button { border: 0; }
      .login-page button:focus-visible, .login-page input:focus-visible { outline: none; }
      .login-page .screen-noise {
        position: fixed;
        inset: 0;
        z-index: 0;
        pointer-events: none;
        opacity: 0.25;
        background-image: radial-gradient(rgba(69, 61, 98, 0.18) 0.65px, transparent 0.8px);
        background-size: 8px 8px;
        mask-image: linear-gradient(to bottom, #000 0%, transparent 48%);
      }
      .login-page .login-layout {
        position: relative;
        z-index: 1;
        display: grid;
        width: min(1320px, 100%);
        min-height: 100vh;
        grid-template-columns: minmax(0, 1.1fr) minmax(390px, 0.9fr);
        align-items: center;
        gap: clamp(48px, 8vw, 124px);
        padding: clamp(32px, 5vw, 72px);
        margin: 0 auto;
      }
      .login-page .brand-stage {
        position: relative;
        display: flex;
        min-height: min(690px, calc(100vh - 100px));
        flex-direction: column;
        justify-content: space-between;
        padding: 5px 0 4px;
      }
      .login-page .brand-lockup { display: inline-flex; width: fit-content; align-items: center; gap: 12px; text-decoration: none; }
      .login-page .brand-mark {
        position: relative;
        display: grid;
        width: 46px;
        height: 46px;
        place-items: center;
        overflow: hidden;
        color: #fff;
        background: linear-gradient(145deg, #d95f86, #7567aa 78%);
        border: 1px solid rgba(255, 255, 255, 0.75);
        border-radius: 15px 9px 15px 9px;
        box-shadow: 0 9px 24px rgba(157, 80, 125, 0.22);
        font: 800 20px var(--font-display);
      }
      .login-page .brand-mark::after { position: absolute; right: -12px; bottom: -16px; width: 35px; height: 35px; content: ''; border: 1px solid rgba(255,255,255,.46); border-radius: 50%; }
      .login-page .brand-copy strong, .login-page .brand-copy span { display: block; }
      .login-page .brand-copy strong { font: 700 20px/1.1 var(--font-display); letter-spacing: 0.035em; }
      .login-page .brand-copy span { margin-top: 5px; color: var(--ink-faint); font-size: 9px; letter-spacing: 0.17em; text-transform: uppercase; }
      .login-page .editorial-block { position: relative; max-width: 620px; padding: 37px 0 230px; }
      .login-page .eyebrow { display: flex; align-items: center; gap: 10px; margin: 0 0 17px; color: var(--accent-strong); font-size: 10px; font-weight: 750; letter-spacing: 0.17em; text-transform: uppercase; }
      .login-page .eyebrow::before { width: 25px; height: 1px; content: ''; background: currentColor; }
      .login-page .editorial-block h1 { max-width: 590px; margin: 0; font: 700 clamp(37px, 5.2vw, 66px)/1.22 var(--font-display); letter-spacing: -0.045em; }
      .login-page .editorial-block h1 span { display: block; color: var(--violet); }
      .login-page .editorial-copy { max-width: 410px; margin: 18px 0 0; color: var(--ink-soft); font-size: 13px; line-height: 1.9; }
      .login-page .artboard {
        position: absolute;
        right: 0;
        bottom: 0;
        width: min(46%, 270px);
        height: 202px;
        pointer-events: none;
      }
      .login-page .artboard-frame {
        position: absolute;
        inset: 12px 12px 0 0;
        overflow: hidden;
        background: linear-gradient(140deg, rgba(255,255,255,.79), rgba(233,228,247,.66));
        border: 1px solid rgba(117,103,170,.16);
        border-radius: 19px 11px 22px 13px;
        box-shadow: 0 20px 42px rgba(68,58,111,.09);
        transform: rotate(-5deg);
      }
      .login-page .artboard-frame::before {
        position: absolute;
        top: -68px;
        right: -25px;
        width: 180px;
        height: 180px;
        content: '';
        border: 1px solid rgba(217,95,134,.28);
        border-radius: 50%;
        box-shadow: 0 0 0 15px rgba(217,95,134,.035), 0 0 0 31px rgba(117,103,170,.035);
      }
      .login-page .artboard-frame::after {
        position: absolute;
        right: 21px;
        bottom: 21px;
        width: 118px;
        height: 50px;
        content: '';
        opacity: .5;
        background-image: radial-gradient(var(--violet) 1px, transparent 1.4px);
        background-size: 8px 8px;
        mask-image: linear-gradient(90deg, transparent, #000);
      }
      .login-page .frame-index { position: absolute; top: 19px; left: 20px; color: var(--ink-faint); font: 9px ui-monospace, SFMono-Regular, Consolas, monospace; letter-spacing: .08em; }
      .login-page .orbit-core { position: absolute; top: 48px; left: 49px; display: grid; width: 89px; height: 89px; place-items: center; color: #fff; background: linear-gradient(145deg, #dc7295, #8a78b9); border: 7px solid rgba(255,255,255,.67); border-radius: 50%; box-shadow: 0 10px 28px rgba(153,89,139,.19); font: 700 19px var(--font-display); }
      .login-page .orbit-core::before { position: absolute; inset: -15px; content: ''; border: 1px solid rgba(117,103,170,.25); border-radius: 50%; }
      .login-page .orbit-core::after { position: absolute; top: 5px; right: 0; width: 9px; height: 9px; content: ''; background: var(--cyan); border: 2px solid #fff; border-radius: 50%; }
      .login-page .frame-label { position: absolute; right: 20px; bottom: 21px; color: var(--ink-soft); font-size: 8px; letter-spacing: .15em; text-transform: uppercase; }
      .login-page .stage-footer { display: flex; align-items: center; justify-content: space-between; gap: 20px; padding-top: 18px; color: var(--ink-faint); border-top: 1px solid var(--line); font-size: 9px; letter-spacing: .09em; }
      .login-page .stage-footer span:last-child { display: inline-flex; align-items: center; gap: 7px; }
      .login-page .status-dot { width: 6px; height: 6px; background: var(--cyan); border-radius: 50%; box-shadow: 0 0 0 4px rgba(45,169,162,.12); }
      .login-page .login-card {
        position: relative;
        width: 100%;
        max-width: 470px;
        padding: clamp(27px, 4vw, 43px);
        justify-self: end;
        background: var(--surface);
        border: 1px solid rgba(255,255,255,.85);
        border-radius: 24px;
        box-shadow: var(--shadow), inset 0 1px rgba(255,255,255,.72);
        backdrop-filter: blur(18px);
      }
      .login-page .card-kicker { display: flex; align-items: center; gap: 8px; margin-bottom: 17px; color: var(--violet); font-size: 9px; font-weight: 750; letter-spacing: .15em; text-transform: uppercase; }
      .login-page .kicker-mark { display: grid; width: 23px; height: 23px; place-items: center; color: var(--accent-strong); background: var(--accent-soft); border-radius: 8px 5px 8px 5px; }
      .login-page .card-heading h2 { margin: 0; font: 700 27px/1.35 var(--font-display); letter-spacing: -.025em; }
      .login-page .card-heading p { margin: 7px 0 0; color: var(--ink-soft); font-size: 11px; line-height: 1.8; }
      .login-page .mode-switch {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 4px;
        padding: 4px;
        margin: 25px 0 23px;
        background: var(--surface-muted);
        border: 1px solid var(--line);
        border-radius: 12px;
      }
      .login-page .mode-tab {
        display: flex;
        min-height: 39px;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 0 9px;
        color: var(--ink-soft);
        background: transparent;
        border: 1px solid transparent;
        border-radius: 9px;
        cursor: pointer;
        font-size: 11px;
        font-weight: 650;
        transition: color 150ms ease, background 150ms ease, box-shadow 150ms ease, border-color 150ms ease;
      }
      .login-page .mode-tab:hover { color: var(--accent-strong); }
      .login-page .mode-tab[aria-selected='true'] { color: var(--ink); background: var(--surface-solid); border-color: var(--line); box-shadow: 0 3px 9px rgba(37,31,67,.06); }
      .login-page .mode-tab:focus-visible { box-shadow: var(--focus); }
      .login-page .mode-tab svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; stroke-width: 1.7; }
      .login-page .login-form { display: grid; gap: 17px; }
      .login-page .field { display: grid; gap: 7px; }
      .login-page .field-label { display: flex; align-items: center; justify-content: space-between; gap: 8px; color: var(--ink-soft); font-size: 10px; font-weight: 700; }
      .login-page .required-mark { color: var(--accent-strong); }
      .login-page .input-shell { position: relative; display: flex; height: 46px; align-items: center; gap: 10px; padding: 0 13px; background: var(--surface-solid); border: 1px solid var(--line-strong); border-radius: 10px; transition: border-color 150ms ease, box-shadow 150ms ease, background 150ms ease; }
      .login-page .input-shell:hover { border-color: rgba(117,103,170,.42); }
      .login-page .input-shell:focus-within { border-color: var(--accent); box-shadow: var(--focus); }
      .login-page .field-icon { display: grid; width: 16px; height: 16px; flex: 0 0 auto; place-items: center; color: var(--ink-faint); }
      .login-page .field-icon svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; stroke-width: 1.7; }
      .login-page .input-shell input { width: 100%; min-width: 0; height: 100%; padding: 0; color: var(--ink); background: transparent; border: 0; outline: 0; box-shadow: none; font-size: 11px; }
      .login-page .input-shell input::placeholder { color: #aaa7b8; }
      .login-page .input-shell input:focus-visible { box-shadow: none; }
      .login-page .input-shell.invalid { border-color: var(--danger); background: color-mix(in srgb, var(--danger-soft) 24%, var(--surface-solid)); }
      .login-page .input-shell.invalid:focus-within { box-shadow: 0 0 0 3px rgba(200,76,92,.14); }
      .login-page .field-error { display: none; margin: -1px 0 0; color: var(--danger); font-size: 9px; }
      .login-page .field.has-error .field-error { display: block; }
      .login-page .password-toggle { display: grid; width: 30px; height: 30px; flex: 0 0 auto; place-items: center; color: var(--ink-faint); background: transparent; border-radius: 8px; cursor: pointer; }
      .login-page .password-toggle:hover { color: var(--accent-strong); background: var(--accent-soft); }
      .login-page .password-toggle:focus-visible { box-shadow: var(--focus); }
      .login-page .password-toggle svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; stroke-width: 1.7; }
      .login-page .feedback { display: none; align-items: flex-start; gap: 9px; padding: 10px 11px; color: #a33c4b; background: var(--danger-soft); border: 1px solid rgba(200,76,92,.15); border-radius: 9px; font-size: 10px; line-height: 1.55; }
      .login-page .feedback.show { display: flex; }
      .login-page .feedback svg { width: 15px; height: 15px; flex: 0 0 auto; margin-top: 1px; fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; stroke-width: 1.8; }
      .login-page .submit-button {
        display: flex;
        width: 100%;
        min-height: 47px;
        align-items: center;
        justify-content: center;
        gap: 9px;
        margin-top: 2px;
        color: #fff;
        background: linear-gradient(120deg, #d95f86, #bd5a8a 55%, #7567aa);
        border: 1px solid rgba(255,255,255,.4);
        border-radius: 10px;
        box-shadow: 0 9px 19px rgba(189,63,105,.19);
        cursor: pointer;
        font-size: 11px;
        font-weight: 750;
        letter-spacing: .035em;
        transition: transform 150ms ease, box-shadow 150ms ease, filter 150ms ease;
      }
      .login-page .submit-button:hover:not(:disabled) { filter: saturate(1.07); box-shadow: 0 12px 24px rgba(189,63,105,.25); transform: translateY(-1px); }
      .login-page .submit-button:focus-visible { box-shadow: var(--focus), 0 9px 19px rgba(189,63,105,.19); }
      .login-page .submit-button:disabled { cursor: wait; opacity: .78; }
      .login-page .submit-arrow { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; stroke-width: 1.7; }
      .login-page .spinner { display: none; width: 15px; height: 15px; border: 2px solid rgba(255,255,255,.4); border-top-color: #fff; border-radius: 50%; animation: login-spin .72s linear infinite; }
      .login-page .submit-button.is-loading .spinner { display: inline-block; }
      .login-page .submit-button.is-loading .submit-arrow { display: none; }
      .login-page .card-footer { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-top: 18px; margin-top: 21px; color: var(--ink-faint); border-top: 1px solid var(--line); font-size: 8px; letter-spacing: .09em; }
      .login-page .footer-seal { display: inline-flex; align-items: center; gap: 6px; color: var(--ink-soft); letter-spacing: .02em; }
      .login-page .footer-seal svg { width: 13px; height: 13px; fill: none; stroke: var(--cyan); stroke-linecap: round; stroke-linejoin: round; stroke-width: 1.7; }
      @keyframes login-spin { to { transform: rotate(360deg); } }
      @media (max-width: 1100px) {
        .login-page .login-layout { grid-template-columns: minmax(0, 1fr) minmax(355px, .92fr); gap: 42px; padding: 38px; }
        .login-page .editorial-block { padding: 28px 0; }
        .login-page .artboard { display: none; }
      }
      @media (max-width: 820px) {
        .login-page .login-layout { width: min(520px, 100%); min-height: 100svh; grid-template-columns: 1fr; align-content: start; gap: 19px; padding: 24px 18px 28px; }
        .login-page .brand-stage { min-height: 0; }
        .login-page .brand-lockup { gap: 10px; }
        .login-page .brand-mark { width: 39px; height: 39px; border-radius: 13px 8px; font-size: 18px; }
        .login-page .brand-copy strong { font-size: 17px; }
        .login-page .brand-copy span { font-size: 8px; }
        .login-page .editorial-block { padding: 20px 0 14px; }
        .login-page .eyebrow { margin-bottom: 9px; font-size: 8px; }
        .login-page .editorial-block h1 { max-width: 370px; font-size: clamp(27px, 8vw, 38px); line-height: 1.28; }
        .login-page .editorial-block h1 span { display: inline; }
        .login-page .editorial-copy { max-width: 335px; margin-top: 8px; font-size: 10px; line-height: 1.65; }
        .login-page .artboard { display: none; }
        .login-page .stage-footer { display: none; }
        .login-page .login-card { max-width: none; padding: 25px 21px 21px; border-radius: 18px; }
        .login-page .card-kicker { margin-bottom: 11px; }
        .login-page .card-heading h2 { font-size: 23px; }
        .login-page .card-heading p { font-size: 10px; }
        .login-page .mode-switch { margin: 19px 0; }
        .login-page .login-form { gap: 14px; }
        .login-page .card-footer { margin-top: 17px; padding-top: 14px; }
      }
      @media (max-height: 640px) and (min-width: 821px) {
        .login-page .login-layout { padding-top: 24px; padding-bottom: 24px; }
        .login-page .brand-stage { min-height: auto; }
        .login-page .editorial-block { padding-top: 24px; padding-bottom: 20px; }
        .login-page .artboard { display: none; }
      }
      @media (max-width: 360px) {
        .login-page .login-layout { padding-right: 13px; padding-left: 13px; }
        .login-page .login-card { padding-right: 17px; padding-left: 17px; }
      }
      @media (prefers-reduced-motion: reduce) {
        .login-page *, .login-page *::before, .login-page *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
      }
    </style>
  </head>
  <body class="login-page">
    <div class="screen-noise" aria-hidden="true"></div>
    <main class="login-layout">
      <section class="brand-stage" aria-labelledby="brandHeadline">
        <a class="brand-lockup" href="#" aria-label="ACGBox 登录首页">
          <span class="brand-mark" aria-hidden="true">A</span>
          <span class="brand-copy"><strong>ACGBox</strong><span>Animation Archive</span></span>
        </a>
        <div class="editorial-block">
          <p class="eyebrow">A PERSONAL ANIMATION ARCHIVE</p>
          <h1 id="brandHeadline">让喜欢的故事，<span>各有归处。</span></h1>
          <p class="editorial-copy">从一张片单到一座资料库。登录后继续整理动画、系列与每一段值得珍藏的观看记忆。</p>
          <div class="artboard" aria-hidden="true"><div class="artboard-frame"><span class="frame-index">ACG / INDEX · 001</span><span class="orbit-core">A</span><span class="frame-label">CATALOGUE OF STORIES</span></div></div>
        </div>
        <footer class="stage-footer"><span>CURATE · CONNECT · REMEMBER</span><span><i class="status-dot"></i> CONTENT ARCHIVE</span></footer>
      </section>

      <section class="login-card" aria-labelledby="loginTitle">
        <div class="card-kicker"><span class="kicker-mark" aria-hidden="true">✦</span><span>管理端入口</span></div>
        <div class="card-heading">
          <h2 id="loginTitle">欢迎回到资料库</h2>
          <p>选择登录方式，继续进入 ACGBox 工作台。</p>
        </div>

        <div class="mode-switch" role="tablist" aria-label="登录方式">
          <button class="mode-tab" id="usernameTab" type="button" role="tab" aria-selected="true" aria-controls="loginPanel" data-mode="username">
            <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="6.5" r="3.1"/><path d="M3.8 16.7c.8-2.8 2.8-4.2 6.2-4.2s5.4 1.4 6.2 4.2"/></svg>
            账号登录
          </button>
          <button class="mode-tab" id="emailTab" type="button" role="tab" aria-selected="false" aria-controls="loginPanel" data-mode="email" tabindex="-1">
            <svg viewBox="0 0 20 20" aria-hidden="true"><rect x="2.8" y="4.2" width="14.4" height="11.6" rx="2"/><path d="m3.7 5.5 6.3 4.9 6.3-4.9"/></svg>
            邮箱登录
          </button>
        </div>

        <form class="login-form" id="loginForm" novalidate>
          <div class="field" id="identityField">
            <label class="field-label" for="identityInput"><span id="identityLabel">登录账号</span><span class="required-mark">必填</span></label>
            <div class="input-shell" id="identityShell">
              <span class="field-icon" aria-hidden="true"><svg viewBox="0 0 20 20"><circle cx="10" cy="6.5" r="3.1"/><path d="M3.8 16.7c.8-2.8 2.8-4.2 6.2-4.2s5.4 1.4 6.2 4.2"/></svg></span>
              <input id="identityInput" name="username" type="text" autocomplete="username" placeholder="请输入账号" required aria-describedby="identityError" />
            </div>
            <p class="field-error" id="identityError" aria-live="polite"></p>
          </div>

          <div class="field" id="passwordField">
            <label class="field-label" for="passwordInput">登录密码 <span class="required-mark">必填</span></label>
            <div class="input-shell" id="passwordShell">
              <span class="field-icon" aria-hidden="true"><svg viewBox="0 0 20 20"><rect x="3.4" y="8.5" width="13.2" height="8.4" rx="2"/><path d="M6.3 8.3V5.9a3.7 3.7 0 0 1 7.4 0v2.4M10 11.8v2"/></svg></span>
              <input id="passwordInput" name="password" type="password" autocomplete="current-password" placeholder="请输入密码" required aria-describedby="passwordError" />
              <button class="password-toggle" id="passwordToggle" type="button" aria-label="显示密码" aria-pressed="false">
                <svg id="eyeIcon" viewBox="0 0 20 20" aria-hidden="true"><path d="M2 10s2.8-5 8-5 8 5 8 5-2.8 5-8 5-8-5-8-5Z"/><circle cx="10" cy="10" r="2.2"/></svg>
              </button>
            </div>
            <p class="field-error" id="passwordError" aria-live="polite"></p>
          </div>

          <div class="feedback" id="loginFeedback" role="alert" aria-live="assertive">
            <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="7.3"/><path d="M10 6.2v4.3M10 13.5h.01"/></svg>
            <span id="feedbackMessage">账号或密码错误，请检查后重试。</span>
          </div>

          <button class="submit-button" id="submitButton" type="submit">
            <span class="spinner" aria-hidden="true"></span>
            <span id="submitLabel">登录 ACGBox</span>
            <svg class="submit-arrow" viewBox="0 0 20 20" aria-hidden="true"><path d="M3.5 10h12M10.5 5l5 5-5 5"/></svg>
          </button>
        </form>

        <footer class="card-footer"><span>ACGBOX · ANIMATION ARCHIVE</span><span class="footer-seal"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.8 13 4v3.7c0 3.1-2 5.2-5 6.5-3-1.3-5-3.4-5-6.5V4l5-2.2Z"/><path d="m5.8 7.8 1.5 1.5 3-3"/></svg> 私人资料空间</span></footer>
      </section>
    </main>
    <script>
      (() => {
        const form = document.getElementById('loginForm');
        const usernameTab = document.getElementById('usernameTab');
        const emailTab = document.getElementById('emailTab');
        const identityField = document.getElementById('identityField');
        const identityShell = document.getElementById('identityShell');
        const identityInput = document.getElementById('identityInput');
        const identityLabel = document.getElementById('identityLabel');
        const passwordInput = document.getElementById('passwordInput');
        const passwordToggle = document.getElementById('passwordToggle');
        const submitButton = document.getElementById('submitButton');
        const submitLabel = document.getElementById('submitLabel');
        const feedback = document.getElementById('loginFeedback');
        let mode = 'username';
        let pendingTimer;

        const fieldParts = {
          identity: { field: identityField, shell: identityShell, input: identityInput, error: document.getElementById('identityError') },
          password: { field: document.getElementById('passwordField'), shell: document.getElementById('passwordShell'), input: passwordInput, error: document.getElementById('passwordError') }
        };

        function clearFieldError(key) {
          const item = fieldParts[key];
          item.field.classList.remove('has-error');
          item.shell.classList.remove('invalid');
          item.input.setAttribute('aria-invalid', 'false');
          item.error.textContent = '';
        }

        function setFieldError(key, message) {
          const item = fieldParts[key];
          item.field.classList.add('has-error');
          item.shell.classList.add('invalid');
          item.input.setAttribute('aria-invalid', 'true');
          item.error.textContent = message;
        }

        function clearFeedback() {
          feedback.classList.remove('show');
        }

        function setMode(nextMode) {
          if (nextMode === mode || submitButton.disabled) return;
          mode = nextMode;
          const isEmail = mode === 'email';
          usernameTab.setAttribute('aria-selected', String(!isEmail));
          emailTab.setAttribute('aria-selected', String(isEmail));
          usernameTab.tabIndex = isEmail ? -1 : 0;
          emailTab.tabIndex = isEmail ? 0 : -1;
          identityLabel.textContent = isEmail ? '登录邮箱' : '登录账号';
          identityInput.name = isEmail ? 'email' : 'username';
          identityInput.type = isEmail ? 'email' : 'text';
          identityInput.autocomplete = isEmail ? 'email' : 'username';
          identityInput.placeholder = isEmail ? '请输入邮箱' : '请输入账号';
          identityInput.value = '';
          clearFieldError('identity');
          clearFieldError('password');
          clearFeedback();
        }

        function validateField(key) {
          const item = fieldParts[key];
          const value = item.input.value;
          if (!value.trim()) {
            setFieldError(key, key === 'password' ? '请输入密码。' : mode === 'email' ? '请输入邮箱。' : '请输入账号。');
            return false;
          }
          if (key === 'identity' && mode === 'email' && !item.input.validity.valid) {
            setFieldError(key, '邮箱格式不正确，请检查后重试。');
            return false;
          }
          clearFieldError(key);
          return true;
        }

        [usernameTab, emailTab].forEach((tab) => {
          tab.addEventListener('click', () => setMode(tab.dataset.mode));
          tab.addEventListener('keydown', (event) => {
            if (event.key === 'ArrowLeft' || event.key === 'ArrowRight') {
              event.preventDefault();
              const nextTab = mode === 'username' ? emailTab : usernameTab;
              setMode(nextTab.dataset.mode);
              nextTab.focus();
            }
          });
        });

        Object.entries(fieldParts).forEach(([key, item]) => {
          item.input.addEventListener('input', () => {
            clearFieldError(key);
            clearFeedback();
          });
          item.input.addEventListener('blur', () => {
            if (item.input.value || item.input.required) validateField(key);
          });
        });

        passwordToggle.addEventListener('click', () => {
          const showing = passwordInput.type === 'text';
          passwordInput.type = showing ? 'password' : 'text';
          passwordToggle.setAttribute('aria-pressed', String(!showing));
          passwordToggle.setAttribute('aria-label', showing ? '显示密码' : '隐藏密码');
        });

        form.addEventListener('submit', (event) => {
          event.preventDefault();
          clearFeedback();
          const identityValid = validateField('identity');
          const passwordValid = validateField('password');
          if (!identityValid) {
            identityInput.focus();
            return;
          }
          if (!passwordValid) {
            passwordInput.focus();
            return;
          }

          submitButton.disabled = true;
          submitButton.classList.add('is-loading');
          submitButton.setAttribute('aria-busy', 'true');
          submitLabel.textContent = '正在登录';
          clearTimeout(pendingTimer);
          pendingTimer = window.setTimeout(() => {
            submitButton.disabled = false;
            submitButton.classList.remove('is-loading');
            submitButton.removeAttribute('aria-busy');
            submitLabel.textContent = '登录 ACGBox';
            document.getElementById('feedbackMessage').textContent = '账号或密码错误，请检查后重试。';
            feedback.classList.add('show');
          }, 650);
        });
      })();
    </script>
  </body>
</html>
