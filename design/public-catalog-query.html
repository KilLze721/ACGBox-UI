<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>动画查询 · ACGBox</title>
  <script>
    const themeKey = 'acgbox-public-catalog-theme';
    try {
      if (localStorage.getItem(themeKey) === 'day') document.documentElement.dataset.theme = 'day';
    } catch {
      // 浏览器禁用本地存储时，仍可在本次访问中切换主题。
    }
  </script>
<style>
    :root {
      color-scheme:dark;
      --night:#14181e; --ink:#e8edf3; --muted:#a6b2c0;
      --surface:#1a2028; --raised:#202730; --line:#343e4b; --hover:#28323e;
      --lilac:#a0c5ef; --accent-fill:#a0c5ef; --accent-ink:#142435; --selected:#263e55;

      --content-width:1080px;
      --serif:"Noto Serif SC","Source Han Serif SC","Songti SC","SimSun",serif;
      --sans:"IBM Plex Sans","PingFang SC","Microsoft YaHei",sans-serif;
    }
    * { box-sizing:border-box }
    body { margin:0; background:var(--night); color:var(--ink); font:14px/1.5 var(--sans) }
    a { color:inherit; text-decoration:none }
    button,input { font:inherit; color:inherit }
    button { cursor:pointer }
    :focus-visible { outline:2px solid var(--lilac); outline-offset:3px }
    [hidden] { display:none !important }
    .wrap { width:min(var(--content-width),calc(100% - 52px)); margin-inline:auto }
    @media (min-width:1240px) {
      /* 纹样限于正文外侧，靠近内容边缘逐渐淡出。 */
      main.wrap::before,main.wrap::after {
        content:"";
        position:fixed;
        top:80px;
        bottom:0;
        width:calc((100% - var(--content-width)) / 2 - 18px);
        pointer-events:none;
        background:
          radial-gradient(circle at 22px 25px,#c9b7f135 0 1.1px,transparent 1.8px) 0 0 / 93px 117px,
          radial-gradient(circle at 56px 66px,#b7a4e329 0 .8px,transparent 1.5px) 9px 17px / 109px 139px,
          radial-gradient(circle at 12px 45px,#d9c6ff20 0 .6px,transparent 1.3px) 31px 11px / 71px 87px;
      }
      main.wrap::before { left:0; mask-image:linear-gradient(to right,#000 18%,transparent 100%) }
      main.wrap::after { right:0; background-position:32px 27px,64px 8px,5px 39px; mask-image:linear-gradient(to left,#000 18%,transparent 100%) }
      [data-theme=day] main.wrap::before,[data-theme=day] main.wrap::after {
        background:radial-gradient(circle at center,#a481c628 0 1px,transparent 1.7px) 0 0 / 24px 24px;
      }
      [data-theme=day] main.wrap::after { background-position:12px 12px }
    }
    .glass { border:1px solid var(--line); background:var(--surface) }
    .site-head { border-width:0 0 1px }
    .masthead { display:flex; align-items:center; gap:24px; min-height:54px }
    .brand { display:flex; align-items:center; gap:7px; font:700 23px/1 Georgia,serif; white-space:nowrap }
    .brand-mark { display:grid; place-items:center; width:30px; height:30px; border-radius:5px; color:var(--lilac); border:1px solid var(--line) }
    .site-nav { display:flex; align-self:stretch; gap:6px }
    .site-nav a { display:flex; align-items:center; padding:0 12px; border-bottom:2px solid transparent; color:var(--muted); font-weight:600; white-space:nowrap }
    .site-nav a:hover { color:var(--lilac); background:var(--hover) }
    .site-nav a[aria-current] { border-bottom-color:var(--lilac); color:var(--lilac) }
    .sample { margin-left:auto; color:var(--muted); white-space:nowrap; font-size:12px }
    .theme-toggle { flex:none; display:grid; place-items:center; width:40px; height:40px; margin-left:-12px; border:1px solid transparent; border-radius:5px; background:none; color:var(--muted) }
    .theme-toggle:hover { background:var(--hover); color:var(--lilac) }
    .theme-toggle .sun,[data-theme=day] .theme-toggle .moon { display:none }
    [data-theme=day] .theme-toggle .sun { display:block }
    .account-avatar { display:grid; flex:none; place-items:center; width:40px; height:40px; margin-left:-18px; padding:0; border:1px solid var(--line); border-radius:50%; background:var(--surface); color:var(--muted) }
    .account-avatar:hover,.account-avatar[aria-expanded=true] { border-color:var(--lilac) }
    .account-avatar.signed-in { background:var(--selected); color:var(--lilac); font:700 17px/1 var(--sans) }
    .account-menu { position:fixed; inset:51px max(26px,calc((100% - var(--content-width)) / 2)) auto auto; margin:0; min-width:154px; padding:4px; border:1px solid var(--line); border-radius:5px; background:var(--surface); color:var(--ink); box-shadow:0 3px 10px #10182024 }
    .account-menu button { display:block; width:100%; min-height:40px; padding:6px 10px; border:0; border-radius:3px; background:none; text-align:left }
    .account-menu button:is(:hover,:focus-visible) { background:var(--hover) }
    .account-menu button:last-child { border-top:1px solid var(--line); color:var(--muted) }
    .account-menu button:focus-visible { outline-offset:-2px }
    h1,h2,h3,p { margin:0 }
    .intro { display:grid; gap:10px; padding:17px 0 13px }
    h1 { font:700 clamp(24px,3vw,34px)/1.22 var(--serif) }
    .query { width:min(100%,710px); border-radius:5px; padding:3px }
    .search-row { display:flex; align-items:center; gap:6px }
    .search-box { min-width:0; flex:1; display:flex; align-items:center; gap:9px; padding:0 9px }
    .search-box svg { flex:none; color:var(--muted) }
    .search-box input { width:100%; min-width:0; min-height:36px; border:0; outline:none; background:transparent }
    .query:focus-within { border-color:var(--lilac) }
    .search-box input::placeholder { color:var(--muted) }
    .primary,.quiet,.page-button,.option { border:1px solid var(--line); border-radius:4px; background:var(--surface); min-height:36px; padding:0 11px; font-weight:600 }
    .primary { background:var(--accent-fill); color:var(--accent-ink); border-color:var(--accent-fill); padding-inline:19px }
    .primary:hover { filter:brightness(.9) }
    .quiet:hover,.page-button:not(:disabled):hover,.option:hover { background:var(--hover); color:var(--lilac) }
    .directory { display:grid; grid-template-columns:minmax(0,1fr) minmax(245px,285px); gap:15px; align-items:start }
    .results { grid-column:1; grid-row:1; min-width:0; border-radius:5px; overflow:hidden }
    .sidebar { grid-column:2; grid-row:1; min-width:0; border-radius:5px; padding:12px 13px }
    .mobile-filters { display:none; width:100%; text-align:left; justify-content:space-between; align-items:center }
    .filter-top,.result-head { display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:8px }
    .filter-top h2 { font:700 16px/1.3 var(--sans) }
    .text-btn { border:0; padding:4px 0; background:transparent; color:var(--lilac); font-size:12px }
    .text-btn:hover { color:var(--lilac); text-decoration:underline }
    .facet { border-top:1px solid var(--line); margin-top:9px; padding-top:8px }
    .facet h3 { font-size:13px; margin-bottom:4px; font-weight:650 }
    .options,.sort,.applied { display:flex; flex-wrap:wrap; gap:5px; align-items:center }
    .option { min-height:30px; padding:2px 8px; border-color:transparent; background:transparent; color:var(--muted); font-size:13px; font-weight:500 }
    .option[aria-pressed=true],.page-button[aria-current=page] { background:var(--selected); border-color:var(--line); color:var(--lilac); font-weight:700 }
    .option[aria-pressed=true]:hover,.page-button[aria-current=page]:hover { border-color:var(--lilac); color:var(--lilac) }
    .hint { color:var(--muted); font-size:11px; margin:-2px 0 6px }
    .calendar { border:1px solid var(--line); background:var(--raised); border-radius:4px; padding:5px }
    .calendar-nav { display:grid; grid-template-columns:29px 1fr 29px; align-items:center; gap:4px; margin-bottom:4px; text-align:center; color:var(--muted); font-size:12px; font-variant-numeric:tabular-nums }
    .calendar-nav button { padding:0; min-height:28px; font-size:17px; line-height:1 }
    .years { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:3px }
    .years .option { padding:2px; border-radius:3px; font-variant-numeric:tabular-nums }
    .result-head { padding:7px 13px; border-bottom:1px solid var(--line) }
    .result-heading { display:flex; align-items:baseline; flex-wrap:wrap; gap:3px 9px }
    .result-heading h2 { font:700 16px/1.3 var(--sans) }
    .result-count { color:var(--muted); font-size:12px }
    .sort { color:var(--muted); font-size:12px }
    .sort .option { padding-inline:8px }
    .applied { padding:8px 15px; border-bottom:1px solid var(--line) }
    .chip { border:1px solid var(--line); background:var(--selected); color:var(--lilac); border-radius:4px; padding:3px 8px; overflow-wrap:anywhere; max-width:100%; text-align:left }
    .chip:hover { border-color:var(--lilac) }
    .work { min-width:0; display:grid; grid-template-columns:72px minmax(0,1fr); gap:12px; padding:10px 13px; border-bottom:1px solid var(--line); align-items:start }
    .cover { width:100%; aspect-ratio:2/3; border-radius:3px; object-fit:cover; display:block; border:1px solid var(--line); background:var(--raised) }
    .work-info { min-width:0 }
    .work h3 { font:700 17px/1.35 var(--sans); overflow-wrap:anywhere }
    .alias,.credits { margin-top:2px; color:var(--muted); font-size:12px; overflow-wrap:anywhere }
    .meta,.row-tags { display:flex; align-items:center; flex-wrap:wrap; gap:4px 8px; color:var(--muted); margin-top:5px; font-size:12px }
    .meta .dot::before { content:"·"; margin-right:8px }
    .status { white-space:nowrap; color:var(--muted) }
    .status.ongoing { color:var(--lilac) }
    .status::before { content:"·"; margin-right:7px; color:var(--muted) }
    .row-tags span { color:var(--muted) }
    .row-tags span::before { content:"#"; margin-right:2px; opacity:.75 }
    .empty { text-align:center; padding:32px 14px }
    .empty p { margin:7px 0 13px; color:var(--muted) }
    .paging { display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:6px; padding:13px 8px }
    .page-button { min-width:37px; padding-inline:8px }
    .page-button:disabled,.calendar-nav button:disabled { cursor:default; opacity:.55 }
    .foot { display:flex; justify-content:space-between; flex-wrap:wrap; gap:5px 12px; margin-top:14px; padding:12px 0 19px; border-top:1px solid var(--line); color:var(--muted); font-size:12px }
    .work-title,.series-link { color:var(--lilac) }
    .work-title:hover,.series-link:hover { text-decoration:underline; text-underline-offset:3px }
    .work-cover { display:block; border-radius:3px }
    .cover.cover-empty { display:grid; place-items:center; padding:4px; text-align:center; color:var(--muted); font-size:12px }
    .detail-nav { display:flex; align-items:center; flex-wrap:wrap; gap:8px 12px; margin:13px 0 8px }
    .detail-back { display:inline-flex; align-items:center; gap:6px; min-height:37px; padding:3px 4px; border:0; background:none; color:var(--lilac); font-weight:600 }
    .detail-back:hover { text-decoration:underline; text-underline-offset:3px }
    .detail-nav span { color:var(--muted); font-size:12px; border-left:1px solid var(--line); padding-left:10px }
    .detail-hero { display:grid; grid-template-columns:146px minmax(0,1fr); gap:18px; align-items:start; padding:16px; border-radius:5px }
    .detail-heading { overflow-wrap:anywhere }
    .detail-kind { display:inline-block; margin-bottom:4px; color:var(--muted); font-size:12px }
    .detail-heading .alias { font-size:14px; margin-top:5px }
    .detail-facts,.detail-credits { display:grid; gap:8px 12px; margin:14px 0 0 }
    .detail-facts { grid-template-columns:repeat(auto-fit,minmax(115px,1fr)) }
    .detail-facts div,.detail-credits div { min-width:0 }
    .detail-facts div { border-top:1px solid var(--line); padding-top:7px }
    .detail-facts dt,.detail-credits dt { color:var(--muted); font-size:12px }
    .detail-facts dd,.detail-credits dd { margin:2px 0 0; overflow-wrap:anywhere }
    .detail-body { display:grid; grid-template-columns:minmax(0,1fr) minmax(220px,34%); align-items:start; margin-top:10px; border:1px solid var(--line); border-radius:5px; background:var(--surface) }
    .detail-body .detail-panel { border:0; background:none }
    .detail-body .detail-panel:nth-child(2) { border-left:1px solid var(--line) }
    .detail-body .detail-series { border-top:1px solid var(--line) }
    .detail-panel { min-width:0; padding:14px 16px; overflow-wrap:anywhere }
    .detail-panel h2 { font:700 16px/1.4 var(--sans); margin-bottom:6px }
    .detail-panel p { color:var(--muted); line-height:1.7 }
    .detail-credits { grid-template-columns:1fr 1fr; margin:0 }
    .detail-tags { margin-top:13px; border-top:1px solid var(--line); padding-top:11px }
    .detail-series { grid-column:1/-1 }
    .series-items { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:0 12px; list-style:none; padding:0; margin:7px 0 0 }
    .series-link { display:flex; flex-wrap:wrap; align-items:baseline; gap:2px 8px; border-top:1px solid var(--line); padding:8px 2px; color:var(--lilac) }
    .series-link small { color:var(--muted) }
    .personal-actions,.modal-actions { display:flex; flex-wrap:wrap; align-items:center; gap:8px }
    .personal-actions { margin-top:16px }
    .personal-actions button { display:inline-flex; align-items:center; gap:6px; min-height:39px }
    .personal-actions strong { font-size:12px; font-weight:650 }
    .personal-actions button[aria-pressed=true] { color:var(--lilac); border-color:currentColor }
    .records-panel.personal-dialog { position:fixed; inset:0 0 0 auto; width:min(440px,100%); max-width:100%; height:100dvh; max-height:none; margin:0; border-radius:5px 0 0 5px; padding:0; overscroll-behavior:contain }
    .records-head { position:sticky; top:0; z-index:1; display:flex; justify-content:space-between; align-items:center; gap:8px; padding:13px 15px; border-bottom:1px solid var(--line); background:var(--surface) }
    .records-head p { margin:4px 0 0; font-size:12px }
    .records-head button { flex:none }
    .mine-edit { display:inline-flex; align-items:center }
    .personal-notice { padding:8px 0; color:var(--muted) }
    .mine-item { display:grid; grid-template-columns:44px minmax(0,1fr) auto; align-items:center; gap:10px; padding:10px 15px; border-bottom:1px solid var(--line) }
    .mine-item:last-child { border-bottom:0 }
    .mine-item p { color:var(--muted); font-size:12px }
    .mine-item h3 { overflow-wrap:anywhere }
    .mine-score { font-weight:700; color:var(--ink); white-space:nowrap }
    .personal-dialog { width:min(440px,calc(100% - 26px)); max-height:calc(100dvh - 26px); margin:auto; border-radius:6px; padding:17px; color:var(--ink); background:var(--surface); overflow:auto }
    .personal-dialog::backdrop { background:#10172075 }
    .personal-dialog h2 { font:700 19px/1.3 var(--sans) }
    .personal-dialog p { margin-top:6px; color:var(--muted) }
    .modal-actions { justify-content:flex-end; margin-top:15px }
    .modal-actions .primary:disabled { opacity:.55; cursor:not-allowed }
    .score-field { border:0; padding:0; margin:13px 0 0; min-width:0 }
    .score-field legend { margin-bottom:6px; color:var(--lilac); font-size:13px }
    .score-options { display:grid; grid-template-columns:repeat(6,minmax(0,1fr)); gap:5px }
    .score-option { position:relative; display:grid; place-items:center; min-width:0; min-height:39px; padding:0; border:1px solid var(--line); border-radius:4px; cursor:pointer }
    .score-option input { position:absolute; width:1px; height:1px; opacity:0 }
    .score-option:focus-within { outline:2px solid var(--lilac); outline-offset:2px }
    .score-option:has(:checked) { background:var(--selected); border-color:var(--lilac); color:var(--lilac); font-weight:700 }
    [data-theme=day] {
      color-scheme:light;
      --night:#f4f5f6; --ink:#202832; --muted:#56616e;
      --surface:#fff; --raised:#f6f8fa; --line:#d8dfe6; --hover:#edf2f7;
      --lilac:#255786; --accent-fill:#255786; --accent-ink:#fff; --selected:#e5eff8;
    }
    @media (width > 720px) {
      .sidebar {
        --sticky-gap:14px;
        position:sticky;
        top:var(--sticky-gap);
        max-height:calc(100dvh - 2 * var(--sticky-gap));
        overflow-y:auto;
      }
    }
    @media (max-width:720px) {
      .wrap { width:calc(100% - 26px) }
      .directory { grid-template-columns:minmax(0,1fr); gap:9px }
      .sidebar,.results { grid-column:1; grid-row:auto }
      .sidebar { padding:6px }
      .mobile-filters { display:flex; border:0; min-height:40px; background:none }
      .mobile-filters[aria-expanded=false] + .filter-body { display:none }
      .filter-body { padding:8px }
      .detail-body { grid-template-columns:minmax(0,1fr) }
      .detail-body .detail-panel:nth-child(2) { border-left:0; border-top:1px solid var(--line) }
      .sidebar :is(.option,.calendar-nav button) { min-height:36px }
    }
    @media (max-width:450px) {
      .masthead { gap:8px; min-height:53px }
      .brand { font-size:22px; gap:5px }
      .brand-mark { width:27px; height:27px }
      .site-nav { gap:2px }
      .site-nav a { padding-inline:8px }
      .sample { font-size:11px }
      .theme-toggle { margin-left:0 }
      .account-avatar { margin-left:0 }
      .account-menu { inset:50px 13px auto auto }
      .intro { padding:13px 0 9px; gap:8px }
      .primary { padding-inline:12px }

      .result-head,.applied { padding-inline:10px }
      .work { grid-template-columns:62px minmax(0,1fr); padding:9px 10px; gap:9px }
      .work h3 { font-size:16px }
      .detail-hero { grid-template-columns:86px minmax(0,1fr); gap:10px; padding:12px }
      .detail-heading h1 { font-size:24px }
      .detail-facts { grid-template-columns:repeat(auto-fit,minmax(78px,1fr)); gap:5px 8px }
      .detail-facts dt { font-size:11px }
      .detail-panel { padding:12px }
      .series-items { grid-template-columns:minmax(0,1fr) }
    }
    @media (max-width:420px) {
      .masthead .sample { display:none }
      .theme-toggle { margin-left:auto }
      .mine-item { padding-inline:9px }
      .mine-item .quiet { padding-inline:7px }
      .records-panel.personal-dialog { border-radius:0 }
    }
    @media (max-width:360px) {
      .masthead { gap:5px }
      .brand { font-size:19px }
      .brand-mark { width:25px; height:25px }
      .site-nav a { padding-inline:6px }
    }
  </style>
</head>
<body>
  <header class="site-head glass">
    <div class="wrap masthead">
      <div class="brand"><span class="brand-mark" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="m12 3 8 4.5v9L12 21l-8-4.5v-9L12 3Z"/><path d="m4 7.5 8 4.5 8-4.5M12 12v9M8 5.2l8 4.5"/></svg></span>ACGBox</div>
      <nav class="site-nav" aria-label="资料库分类">
        <a href="#anime" data-view="anime" aria-current="page">动画</a>
        <a href="#book" data-view="book">书籍</a>
      </nav>
      <span class="sample">演示资料库</span>
      <button class="theme-toggle" id="theme-toggle" type="button" aria-label="白天主题" aria-pressed="false" title="当前为夜晚，切换到白天">
        <svg class="moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.6 15.2a8.8 8.8 0 0 1-11.8-11.8A8.8 8.8 0 1 0 20.6 15.2Z"/><path d="M17.5 3v5m-2.5-2.5h5"/></svg>
        <svg class="sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4m0-14.2-1.4 1.4M6.3 17.7l-1.4 1.4"/></svg>
      </button>
      <button class="account-avatar" id="account-avatar" type="button" aria-label="演示登录">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="3.4"/><path d="M5 20v-1.5a7 7 0 0 1 14 0V20"/></svg>
        <span hidden aria-hidden="true">A</span>
      </button>
      <div class="account-menu" id="account-menu" popover role="menu" aria-label="个人操作">
        <button type="button" role="menuitem" data-records="favorites" autofocus>收藏记录</button>
        <button type="button" role="menuitem" data-records="ratings">评分记录</button>
        <button type="button" role="menuitem" id="demo-logout">演示退出</button>
      </div>
    </div>
  </header>
  <main class="wrap">
    <div id="catalog-view">
    <div class="intro">
      <h1 id="page-title">动画查询</h1>
      <form class="query glass" id="query" role="search" aria-label="作品搜索">
        <div class="search-row">
          <label class="search-box">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4.5 4.5" stroke-linecap="round"/></svg>
            <input id="keyword" type="search" aria-label="搜索作品名、别名、系列、标签、人物或公司" placeholder="搜索作品、人物、公司等" autocomplete="off">
          </label>
          <button class="primary" type="submit">搜索</button>
        </div>
      </form>
    </div>
    <div class="directory">
      <aside class="sidebar glass" aria-label="作品筛选">

    const rows = Object.fromEntries(Object.entries(entries).map(([view, items]) => [view, items.map(
      ([name, alias, series, date, type, status, tags, adaptation, person, company], i) =>
        ({ id: i + 1, name, alias, series, date, year: date.slice(0,4) || '未知', type, status, adaptation, person, company, tags: tags.split('/') })
    )]));
    const views = {
      anime: { title:'动画查询', kind:'动画', date:'放送日期', year:'放送年份', type:'放送类型', status:'放送状态', adaptation:'改编类型' },
      book: { title:'书籍查询', kind:'书籍', date:'首次发表日期', year:'首次发表年份', type:'书籍类型', status:'连载状态', adaptation:'改编类型' }
    };
    // 仅为代表性条目补充详情，未填写的资料不推断。
    const detailSamples = {
      'anime/1': { summary:'每天傍晚，云下邮局会收到几封没有地址的信。新来的投递员跟着一只抱星兔穿过云海，在看不见的街巷里寻找那些等待回信的人。', count:['集数','12 集'], role:'导演' },
      'anime/2': { summary:'一座海边电台收到来自未来的求救信号。值夜的工程师沿着潮线追踪声源，却发现信号正在指向一艘早已失踪的船。', count:['集数','1 集'], role:'导演' },
      'anime/14': { noCover:true },
      'book/1': { summary:'北岸的灯塔停止闪烁后，巡夜人开始在航海日志里记录不属于这一片海的潮汐。小说沿着她的笔记，拼起失踪船只留下的线索。', count:['卷数','2 卷'], role:'作者' },
      'book/2': { summary:'以一位年轻制图师的视角，描绘灯塔熄灭后北岸的日常与海上谜团。', count:['章节数','8 话'], role:'漫画作者' },
      'book/11': { noCover:true }
    };
    const facets = ['type','adaptation','status','year'];
    const keys = ['q',...facets,'sort','page'];
    const pageSize = 8;
    const personalKey = 'acgbox-public-catalog-personal';
    const personal = { signedIn:false, favorites:{}, ratings:{} };
    try {
      const stored = JSON.parse(localStorage.getItem(personalKey));
      if (stored) Object.assign(personal,stored);
    } catch {
      // 本地数据不可用时，以空记录开始演示。
    }
    let state;
    let shownView;
    let decade;
    let activeDetail;
    let activeMine;
    let returningToRecords;
    let pendingAction;
    let ratingTarget;
    const normalize = text => text.trim().normalize('NFKC').toLocaleLowerCase();
    const collator = new Intl.Collator('zh-CN');
    const decadeFor = year => Math.floor(Number(year) / 10) * 10;
    const defaultDecade = view => decadeFor(Math.max(...rows[view].map(row => Number(row.year) || 0)));
    const validYear = value => /^\d{4}$/.test(value) && Number(value) >= 1900 && Number(value) < 2100;
    const choices = (view,key) => [...new Set(rows[view].flatMap(row => key === 'tag' ? row.tags : row[key]))];

    // 以网址片段保存当前分类、查询与多选标签，支持独立打开和浏览器前进、后退。
    function readHash() {
      const [path, query] = location.hash.slice(1).split('?');
      const view = path === 'book' ? 'book' : 'anime';
      const params = new URLSearchParams(query);
      const next = { view, q: (params.get('q') || '').trim(), sort: 'new', page: Math.max(1, parseInt(params.get('page'), 10) || 1) };
      if (['old','name'].includes(params.get('sort'))) next.sort = params.get('sort');
      for (const key of facets) {
        const value = params.get(key) || '';
        next[key] = (key === 'year' && validYear(value)) || choices(view,key).includes(value) ? value : '';
      }
      next.tags = [...new Set(params.getAll('tag'))].filter(value => choices(view,'tag').includes(value));
      return next;
    }

    function hashFor(next) {
      const params = new URLSearchParams();
      for (const key of keys) {
        const value = next[key];
        if (value && !(key === 'page' && value === 1) && !(key === 'sort' && value === 'new')) params.set(key, value);
      }
      for (const tag of next.tags) params.append('tag',tag);
      return '#' + next.view + (params.size ? '?' + params : '');
    }

    function commit(next) {
      state = next;
      draw();
      const hash = hashFor(state);
      if (location.hash !== hash) history.pushState(null, '', hash);
    }

    function results() {
      const term = normalize(state.q);
      const exact = row => term && [row.name,row.alias].some(value => normalize(value) === term);
      return rows[state.view].filter(row =>
        (!term || [row.name,row.alias,row.series,row.person,row.company,...row.tags].some(value => normalize(value).includes(term))) &&
        facets.every(key => !state[key] || row[key] === state[key]) && state.tags.every(tag => row.tags.includes(tag))
      ).sort((a,b) => {
        if (state.sort === 'name') return collator.compare(a.name,b.name) || a.id - b.id;
        if (!a.date || !b.date) return Number(Boolean(b.date)) - Number(Boolean(a.date)) || a.id - b.id;
        if (state.sort === 'new' && Boolean(exact(a)) !== Boolean(exact(b))) return exact(a) ? -1 : 1;
        return (state.sort === 'old' ? a.date.localeCompare(b.date) : b.date.localeCompare(a.date)) || a.id - b.id;
      });
    }

    function card(row) {
      const badge = ['放送中','连载中'].includes(row.status) ? 'ongoing' : ['未放送','未连载'].includes(row.status) ? 'pending' : '';
      const date = row.date ? `<time datetime="${row.date}">${row.date}</time>` : '<span>日期未知</span>';
      const href = '#' + state.view + '/' + row.id;
      const label = `查看《${row.name}》（${row.type}）详情`;
      return `<article class="work"><a class="work-cover" href="${href}" data-detail-link aria-label="${label}">${coverFor(state.view,row)}</a><div class="work-info"><h3><a class="work-title" href="${href}" data-detail-link aria-label="${label}">${row.name}</a></h3><p class="alias" lang="en">${row.alias}</p><div class="meta">${date}<span class="dot">${row.type}</span><span class="dot">${row.adaptation}</span><span class="status ${badge}">${row.status}</span></div><p class="credits">${row.person} · ${row.company}</p><div class="row-tags">${row.tags.map(tag => '<span>' + tag + '</span>').join('')}</div></div></article>`;
    }

    function coverFor(type,row) {
      if (detailSamples[type + '/' + row.id]?.noCover) return '<span class="cover cover-empty">暂无封面</span>';
      const index = (row.id - 1 + (type === 'book' ? 2 : 0)) % assets.covers.length;
      return `<img class="cover" src="${assets.covers[index]}" alt="">`;
    }

    function markCategory(type,onDetail = false) {
      document.querySelectorAll('[data-view]').forEach(link => {
        if (link.dataset.view === type) link.setAttribute('aria-current',onDetail ? 'location' : 'page');
        else link.removeAttribute('aria-current');
      });
    }

    function detailActions(key) {
      return `<div class="personal-actions" data-work-key="${key}">
        <button type="button" class="quiet" data-personal="favorite" aria-pressed="false"><span aria-hidden="true">♡</span><span>收藏</span></button>
        <button type="button" class="quiet" data-personal="rating" aria-haspopup="dialog"><span aria-hidden="true">☆</span>我的评分<strong></strong></button>
      </div>`;
    }

    function syncDetailActions() {
      const actions = $('detail-view').querySelector('[data-work-key]');
      if (!actions) return;
      const key = actions.dataset.workKey;
      const favorite = personal.signedIn && Boolean(personal.favorites[key]);
      const rating = personal.signedIn ? personal.ratings[key]?.score : undefined;
      const button = actions.querySelector('[data-personal=favorite]');
      button.setAttribute('aria-pressed',String(favorite));
      button.firstElementChild.textContent = favorite ? '♥' : '♡';
      button.lastElementChild.textContent = favorite ? '已收藏' : '收藏';
      button.title = favorite ? '取消收藏' : '收藏此作品';
      actions.querySelector('strong').textContent = Number.isInteger(rating) ? rating + ' 分' : '未评分';
    }

    function drawDetail(type,id) {
      const view = views[type];
      const row = rows[type].find(item => String(item.id) === id);
      const sample = detailSamples[type + '/' + id] || {};
      const origin = history.state?.catalogOrigin || '#' + type;
      const originType = origin.startsWith('#book') ? 'book' : 'anime';
      const records = history.state?.recordOrigin;
      const originLabel = records ? recordLabel(records.section) : views[originType].kind + '目录';
      const back = `<div class="detail-nav"><a class="detail-back glass" id="detail-back">← 返回${originLabel}</a><span>${view.kind}详情</span></div>`;
      const screen = $('detail-view');
      markCategory(type,true);
      document.title = (row ? row.name + '（' + row.type + '）' : '未找到作品') + ' · ACGBox';
      if (!row) {
        screen.innerHTML = back + '<section class="detail-panel glass"><h1 id="detail-title" tabindex="-1">未找到作品</h1><p>这条作品不在当前演示资料中，可返回目录继续浏览。</p></section>';
      } else {
        const facts = [[view.type,row.type],[view.date,row.date ? `<time datetime="${row.date}">${row.date}</time>` : '日期未知'],[view.status,row.status],[view.adaptation,row.adaptation]];
        if (sample.count) facts.push(sample.count);
        const pairs = values => values.map(([label,value]) => `<div><dt>${label}</dt><dd>${value}</dd></div>`).join('');
        const relatedTypes = [type === 'anime' ? 'book' : 'anime',type];
        const related = row.series ? relatedTypes.flatMap(kind =>
          rows[kind].filter(item => item.series === row.series && (kind !== type || item.id !== row.id)).map(item =>
            `<li><a class="series-link" href="#${kind}/${item.id}" data-detail-link>${item.name}<small>${views[kind].kind} · ${item.type}</small></a></li>`)) : [];
        screen.innerHTML = back + `<article aria-labelledby="detail-title">
          <header class="detail-hero glass">
            ${coverFor(type,row)}
            <div class="detail-heading"><span class="detail-kind">${view.kind} · ${row.type}</span><h1 id="detail-title" tabindex="-1">${row.name}</h1><p class="alias" lang="en">${row.alias}</p><dl class="detail-facts">${pairs(facts)}</dl>${detailActions(type + '/' + id)}</div>
          </header>
          <div class="detail-body">
            <section class="detail-panel glass"><h2>作品简介</h2><p>${sample.summary || '暂无简介。'}</p></section>
            <section class="detail-panel glass"><h2>主创与公司</h2><dl class="detail-credits">${pairs([[sample.role || '主创',row.person],[type === 'anime' ? '制作公司' : '出版机构',row.company]])}</dl>
              <div class="detail-tags"><h2>标签</h2><div class="row-tags">${row.tags.map(tag => '<span>' + tag + '</span>').join('')}</div></div>
            </section>
            <section class="detail-panel detail-series glass"><h2>同系列作品</h2>${row.series ? '<p>' + row.series + '</p>' : ''}${related.length ? '<ul class="series-items">' + related.join('') + '</ul>' : '<p>暂无同系列作品。</p>'}</section>
          </div>
        </article>`;
      }
      $('detail-back').href = records ? records.hash : origin;
      syncDetailActions();
    }

    function workFor(key) {
      const [kind,id] = key.split('/');
      const row = Object.hasOwn(rows,kind) && rows[kind].find(item => String(item.id) === id);
      return row && {kind,row};
    }

    const recordLabel = section => section === 'ratings' ? '评分记录' : '收藏记录';

    function drawMine() {
      const ratings = activeMine === 'ratings';
      $('records-title').textContent = recordLabel(activeMine);
      const records = Object.entries(personal[activeMine])
        .sort(([,a],[,b]) => (ratings ? b.at - a.at : b - a))
        .map(([key,value]) => {
          const work = workFor(key);
          if (!work || (ratings && !Number.isInteger(value.score))) return '';
          const {kind,row} = work;
          const action = ratings
            ? `<a class="quiet mine-edit" href="#${kind}/${row.id}" data-detail-link aria-label="修改《${row.name}》（${row.type}）的评分">去修改</a>`
            : `<button type="button" class="quiet" data-personal="remove-favorite" data-work-key="${kind}/${row.id}">取消收藏</button>`;
          return `<article class="mine-item"><a class="work-cover" href="#${kind}/${row.id}" data-detail-link aria-label="查看《${row.name}》（${row.type}）详情">${coverFor(kind,row)}</a>
            <div><h3><a class="work-title" href="#${kind}/${row.id}" data-detail-link>${row.name}</a></h3><p>${views[kind].kind} · ${row.type}${ratings ? ' · <span class="mine-score">' + value.score + ' 分</span>' : ''}</p></div>${action}</article>`;
        }).filter(Boolean).join('');
      $('mine-view').innerHTML = records || `<div class="empty"><h3>暂无${ratings ? '评分' : '收藏'}</h3><p>${ratings ? '到作品详情给喜欢的作品打个分。' : '到作品详情收藏想留在书架上的作品。'}</p></div>`;
    }

    function openRecords(section) {
      if (!personal.signedIn) return;
      activeMine = section;
      drawMine();
      const panel = $('records-panel');
      panel.scrollTop = 0;
      panel.showModal();
    }

    function syncAvatar() {
      const avatar = $('account-avatar');
      avatar.classList.toggle('signed-in',personal.signedIn);
      avatar.querySelector('svg').toggleAttribute('hidden',personal.signedIn);
      avatar.querySelector('span').hidden = !personal.signedIn;
      avatar.setAttribute('aria-label',personal.signedIn ? '个人操作' : '演示登录');
      if (personal.signedIn) {
        avatar.setAttribute('popovertarget','account-menu');
        avatar.setAttribute('aria-haspopup','menu');
        avatar.setAttribute('aria-expanded','false');
      } else {
        for (const attr of ['popovertarget','aria-haspopup','aria-expanded']) avatar.removeAttribute(attr);
      }
    }

    function savePersonal() {
      try {
        localStorage.setItem(personalKey,JSON.stringify(personal));
      } catch {
        $('personal-notice').hidden = false;
      }
    }

    function toggleFavorite(key) {
      if (personal.favorites[key]) delete personal.favorites[key];
      else personal.favorites[key] = Date.now();
      savePersonal();
      syncDetailActions();
    }

    function showLogin(action) {
      pendingAction = action;
      $('login-context').textContent = action.type === 'favorite' ? '演示登录后将收藏当前作品。'
        : action.type === 'rating' ? '演示登录后可为当前作品选择并保存分数。' : '演示登录后可通过头像查看收藏和评分记录。';
      $('login-dialog').showModal();
    }

    function showRating(key) {
      ratingTarget = key;
      const {row} = workFor(key);
      const score = personal.ratings[key]?.score;
      $('rating-work').textContent = `《${row.name}》 · ${row.type}`;
      $('rating-clear').hidden = !Number.isInteger(score);
      for (const radio of $('rating-options').querySelectorAll('input')) radio.checked = Number(radio.value) === score;
      syncRatingSelection();
      $('rating-dialog').showModal();
      ($('rating-options').querySelector(':checked') || $('rating-options').querySelector('input')).focus();
    }

    function syncRatingSelection() {
      const choice = $('rating-options').querySelector(':checked');
      $('rating-save').disabled = !choice;
      $('rating-selection').textContent = choice ? '当前选择：' + choice.value + ' 分' : '选择 0–10 的整数分数';
    }

    function option(key,value,label,active,accessibleLabel) {
      return `<button type="button" class="option" data-filter="${key}" data-value="${value}" aria-pressed="${active}"${accessibleLabel ? ' aria-label="' + accessibleLabel + '"' : ''}>${label}</button>`;
    }

    function drawFacets(view) {
      const group = (key,body) => `<section class="facet" aria-labelledby="label-${key}"><h3 id="label-${key}">${view[key] || '标签'}</h3>${body}</section>`;
      const singles = facets.slice(0,3).map(key => group(key, '<div class="options">' +
        ['',...choices(state.view,key)].map(value => option(key,value,value || '全部',state[key] === value)).join('') + '</div>'));
      const years = Array.from({length:10},(_,i) => String(decade + 9 - i));
      const yearOptions = [
        option('year','','全部',!state.year,'全部年份'),
        ...years.map(value => option('year',value,value,state.year === value)),
        option('year','未知','未知',state.year === '未知')
      ].join('');
      const calendar = `<div class="calendar"><div class="calendar-nav"><button class="quiet" type="button" data-decade="-10" aria-label="上一个年代" ${decade <= 1900 ? 'disabled' : ''}>‹</button><span role="status">${decade}–${decade + 9}</span><button class="quiet" type="button" data-decade="10" aria-label="下一个年代" ${decade >= 2090 ? 'disabled' : ''}>›</button></div><div class="years">${yearOptions}</div></div>`;
      const tags = `<p class="hint">多选时须同时包含所选标签</p><div class="options">${choices(state.view,'tag').map(tag => option('tag',tag,tag,state.tags.includes(tag))).join('')}</div>`;
      $('facets').innerHTML = singles.join('') + group('year',calendar) + group('tag',tags);
      const active = facets.filter(key => state[key]).length + state.tags.length;
      $('filter-summary').textContent = active ? '筛选作品 · 已选 ' + active + ' 项' : '筛选作品';
    }

    function draw() {
      const view = views[state.view];
      document.title = view.title + ' · ACGBox';
      markCategory(state.view);
      if (shownView !== state.view) {
        shownView = state.view;
        $('page-title').textContent = view.title;
      }
      $('keyword').value = state.q;
      $('sort').querySelectorAll('[data-sort]').forEach(button => button.setAttribute('aria-pressed',String(button.dataset.sort === state.sort)));
      drawFacets(view);

      const matched = results();
      const pages = Math.max(1,Math.ceil(matched.length / pageSize));
      state.page = Math.min(state.page,pages);
      const start = (state.page - 1) * pageSize;
      $('count').textContent = matched.length ? `共 ${matched.length} 部 · 第 ${state.page} / ${pages} 页` : '共 0 部';
      $('cards').innerHTML = matched.slice(start,start + pageSize).map(card).join('');
      $('cards').hidden = !matched.length;
      $('empty').hidden = Boolean(matched.length);
      $('paging').hidden = pages === 1;
      $('paging').innerHTML = pages > 1 ? [
        `<button class="page-button" type="button" data-page="${state.page - 1}" ${state.page === 1 ? 'disabled' : ''}>上一页</button>`,
        ...Array.from({length:pages}, (_,i) => `<button class="page-button" type="button" data-page="${i + 1}" aria-label="第 ${i + 1} 页" ${state.page === i + 1 ? 'aria-current="page"' : ''}>${i + 1}</button>`),
        `<button class="page-button" type="button" data-page="${state.page + 1}" ${state.page === pages ? 'disabled' : ''}>下一页</button>`
      ].join('') : '';
      const active = ['q',...facets].filter(key => state[key]).map(key => [key,state[key]]);
      active.push(...state.tags.map(tag => ['tag',tag]));
      $('applied').hidden = !active.length;
      $('applied').replaceChildren(...active.map(([key,value]) => {
        const label = (key === 'q' ? '关键词' : key === 'tag' ? '标签' : view[key]) + '：' + value;
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'chip';
        button.dataset.clear = key;
        button.dataset.value = value;
        button.setAttribute('aria-label','移除条件：' + label);
        button.textContent = label + ' ×';
        return button;
      }));
    }

    function clear() {
      decade = defaultDecade(state.view);
      commit({view:state.view, q:'', year:'', type:'', adaptation:'', status:'', tags:[], sort:'new', page:1});
      $('keyword').focus();
    }

    function restore() {
      const detail = location.hash.match(/^#(anime|book)\/([^/?#]+)(?:\?.*)?$/);
      const wasDetail = activeDetail;
      activeDetail = Boolean(detail);
      for (const id of ['login-dialog','rating-dialog','records-panel']) if ($(id).open) $(id).close();
      $('account-menu').hidePopover();
      $('detail-view').hidden = !activeDetail;
      $('catalog-view').hidden = activeDetail;
      if (detail) {
        drawDetail(detail[1],detail[2]);
        $('detail-title').focus({preventScroll:true});
        window.scrollTo(0,0);
        return;
      }
      state = readHash();
      decade = validYear(state.year) ? decadeFor(state.year) : defaultDecade(state.view);
      if (shownView !== state.view) $('more').setAttribute('aria-expanded','false');
      draw();
      if (wasDetail) {
        $('results-title').focus({preventScroll:true});
        window.scrollTo(0,0);
      }
    }

    $('query').addEventListener('submit', event => {
      event.preventDefault();
      commit({...state,q:$('keyword').value.trim(),page:1});
    });
    $('sort').addEventListener('click', event => {
      const sort = event.target.closest('[data-sort]')?.dataset.sort;
      if (sort) commit({...state,q:$('keyword').value.trim(),sort,page:1});
    });
    $('more').addEventListener('click', event => {
      const button = event.currentTarget;
      button.setAttribute('aria-expanded',String(button.getAttribute('aria-expanded') === 'false'));
    });
    $('facets').addEventListener('click', event => {
      const button = event.target.closest('button');
      if (!button) return;
      if (button.dataset.decade) {
        decade += Number(button.dataset.decade);
        drawFacets(views[state.view]);
        const next = $('facets').querySelector(`[data-decade="${button.dataset.decade}"]`);
        (next.disabled ? $('facets').querySelector('[data-decade]:not(:disabled)') : next).focus();
        return;
      }
      const {filter,value} = button.dataset;
      const update = filter === 'tag'
        ? {tags:state.tags.includes(value) ? state.tags.filter(tag => tag !== value) : [...state.tags,value]}
        : {[filter]:value};
      commit({...state,...update,q:$('keyword').value.trim(),page:1});
      $('facets').querySelector(`[data-filter="${filter}"][data-value="${value}"]`).focus({preventScroll:true});
    });
    $('clear').addEventListener('click', clear);
    $('empty-clear').addEventListener('click', clear);
    $('applied').addEventListener('click', event => {
      const chip = event.target.closest('[data-clear]');
      if (!chip) return;
      const {clear:key,value} = chip.dataset;
      const update = key === 'tag' ? {tags:state.tags.filter(tag => tag !== value)} : {[key]:''};
      commit({...state,...update,page:1});
      ($('applied').querySelector('button') || $('results-title')).focus({preventScroll:true});
    });
    $('paging').addEventListener('click', event => {
      const button = event.target.closest('button');
      if (!button || button.disabled) return;
      commit({...state,page:Number(button.dataset.page)});
      $('results-title').focus({preventScroll:true});
      $('results-title').scrollIntoView({block:'start'});
    });
    document.querySelector('.site-nav').addEventListener('click', event => {
      const link = event.target.closest('[data-view]');
      if (!link || event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) return;
      if (!activeDetail && link.dataset.view === state.view) event.preventDefault();
    });
    const accountMenu = $('account-menu');
    const accountAvatar = $('account-avatar');
    accountAvatar.addEventListener('click', () => {
      if (!personal.signedIn) showLogin({type:'account'});
    });
    accountMenu.addEventListener('toggle', () => {
      if (personal.signedIn) accountAvatar.setAttribute('aria-expanded',String(accountMenu.matches(':popover-open')));
    });
    accountMenu.addEventListener('keydown', event => {
      const items = [...accountMenu.querySelectorAll('button')];
      const index = items.indexOf(document.activeElement);
      const next = {ArrowDown:(index + 1) % items.length, ArrowUp:(index + items.length - 1) % items.length, Home:0, End:items.length - 1}[event.key];
      if (next === undefined) return;
      event.preventDefault();
      items[next].focus();
    });
    accountMenu.addEventListener('click', event => {
      const button = event.target.closest('button');
      if (!button) return;
      accountMenu.hidePopover();
      accountAvatar.focus({preventScroll:true});
      if (button.dataset.records) openRecords(button.dataset.records);
      else {
        personal.signedIn = false;
        savePersonal();
        syncAvatar();
        syncDetailActions();
      }
    });
    document.addEventListener('click', event => {
      const button = event.target.closest('[data-personal]');
      if (button) {
        const type = button.dataset.personal;
        const key = button.closest('[data-work-key]')?.dataset.workKey;
        if (!personal.signedIn) showLogin({type,key});
        else if (type === 'rating') showRating(key);
        else {
          toggleFavorite(key);
          if (type === 'remove-favorite') {
            drawMine();
            $('records-panel').querySelector('button').focus({preventScroll:true});
          }
        }
        return;
      }
      const link = event.target.closest('[data-detail-link],#detail-back');
      if (!link || event.button !== 0 || event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) return;
      const previous = history.state?.recordOrigin;
      if (link.id === 'detail-back') {
        if (previous && personal.signedIn) {
          event.preventDefault();
          returningToRecords = previous;
          history.go(-previous.steps);
        }
        return;
      }
      event.preventDefault();
      // 记录面板不修改网址，进入详情后可沿历史返回原页面并重开原记录。
      const fromPanel = Boolean(link.closest('#records-panel'));
      const catalogOrigin = activeDetail ? history.state?.catalogOrigin || '#' + location.hash.split('/')[0].slice(1) : hashFor(state);
      const recordOrigin = fromPanel ? {section:activeMine,steps:1,hash:location.hash || '#anime',scroll:window.scrollY}
        : previous ? {...previous,steps:previous.steps + 1} : null;
      history.pushState({catalogOrigin,recordOrigin}, '', link.hash);
      restore();
    });
    $('demo-login').addEventListener('click', () => {
      const {type,key} = pendingAction;
      personal.signedIn = true;
      savePersonal();
      $('login-dialog').close();
      syncAvatar();
      if (type === 'favorite' && !personal.favorites[key]) toggleFavorite(key);
      if (type === 'rating') showRating(key);
      syncDetailActions();
    });
    $('rating-options').innerHTML = Array.from({length:11},(_,score) =>
      `<label class="option score-option"><input type="radio" name="score" value="${score}" aria-label="${score} 分"><span aria-hidden="true">${score}</span></label>`).join('');
    $('rating-options').addEventListener('change',syncRatingSelection);
    $('rating-cancel').addEventListener('click', () => $('rating-dialog').close());
    function finishRating() {
      savePersonal();
      $('rating-dialog').close();
      syncDetailActions();
    }
    $('rating-clear').addEventListener('click', () => {
      delete personal.ratings[ratingTarget];
      finishRating();
    });
    $('rating-form').addEventListener('submit', event => {
      event.preventDefault();
      const choice = $('rating-options').querySelector(':checked');
      if (!choice) return;
      personal.ratings[ratingTarget] = {score:Number(choice.value),at:Date.now()};
      finishRating();
    });
    window.addEventListener('popstate', () => {
      restore();
      if (returningToRecords) {
        const {section,scroll} = returningToRecords;
        returningToRecords = null;
        openRecords(section);
        requestAnimationFrame(() => window.scrollTo(0,scroll));
      }
    });
    syncAvatar();
    restore();
  </script>
</body>
</html>
